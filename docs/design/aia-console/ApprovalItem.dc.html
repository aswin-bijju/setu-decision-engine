<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="display:flex;flex-direction:column;gap:14px;padding:20px 24px;background:#ffffff;border:1px solid #d6dce2;font-family:Barlow,system-ui,sans-serif;color:#1f2a44;font-size:16px;line-height:1.5">
<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px"><dc-import name="StatusTag" label="{{ it.engine }}" tone="neutral" hint-size="120px,22px"></dc-import><a href="#" style="font-size:15px;font-weight:600;color:#2f6f73;text-underline-offset:3px;font-variant-numeric:tabular-nums">{{ it.id }}</a><span style="font-size:14px;color:#566074">{{ it.kind }} · waiting {{ it.waiting }}</span></div>
<sc-if value="{{ hasActBy }}"><span style="font-size:15px"><span style="color:#566074">Act by </span><strong style="font-weight:600">{{ it.actBy }}</strong></span></sc-if>
</div>
<h3 style="margin:0;font-size:20px;font-weight:600;line-height:1.3;text-wrap:pretty">{{ it.ask }}</h3>
<sc-if value="{{ hasRouting }}"><p style="margin:0;font-size:15px;color:#566074">{{ it.routing }}</p></sc-if>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:13px;font-weight:600;color:#566074">Rests on</span>
<sc-for list="{{ it.evidence }}" as="e" hint-placeholder-count="2">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:15px;line-height:1.45"><span style="flex:1 1 300px;min-width:0">{{ e.fact }}</span><span style="font-size:14px;color:#566074">{{ e.source }}, {{ e.date }}</span><dc-import name="StatusTag" label="{{ e.status }}" tone="{{ e.tone }}" hint-size="80px,22px"></dc-import></div>
</sc-for>
</div>
<sc-if value="{{ hasGates }}"><dc-import name="GateBar" g1="{{ g.g1 }}" g2="{{ g.g2 }}" g3="{{ g.g3 }}" hint-size="100%,26px"></dc-import></sc-if>
<sc-if value="{{ hasLink }}"><a href="#" style="font-size:15px;color:#2f6f73;text-underline-offset:3px">{{ it.link }}</a></sc-if>
<sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" onClick="{{ onApprove }}" style="min-height:44px;padding:0 20px;font-family:inherit;font-size:16px;font-weight:600;color:#ffffff;background:#2f6f73;border:1px solid #2f6f73;border-radius:2px;cursor:pointer" style-hover="background:#1f2a44;border-color:#1f2a44">Approve</button><button type="button" onClick="{{ onAdjust }}" style="min-height:44px;padding:0 20px;font-family:inherit;font-size:16px;font-weight:600;color:#1f2a44;background:#ffffff;border:1px solid #1f2a44;border-radius:2px;cursor:pointer" style-hover="background:#e2eeee">Adjust</button><button type="button" onClick="{{ onReject }}" style="min-height:44px;padding:0 20px;font-family:inherit;font-size:16px;font-weight:600;color:#1f2a44;background:#ffffff;border:1px solid #1f2a44;border-radius:2px;cursor:pointer" style-hover="background:#e2eeee">Reject</button></div>
</sc-if>
<sc-if value="{{ isReasoning }}">
<div style="display:flex;flex-direction:column;gap:10px;padding:16px;background:#f7f7f5;border:1px solid #d6dce2">
<label style="display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600">{{ reasonLabel }}<textarea rows="3" value="{{ reason }}" onChange="{{ onReason }}" style="width:100%;box-sizing:border-box;padding:10px 12px;font-family:inherit;font-size:16px;font-weight:400;line-height:1.5;color:#1f2a44;background:#ffffff;border:1px solid #566074;border-radius:2px;resize:vertical"></textarea></label>
<span style="font-size:14px;color:#566074">The reason is logged with the item. A reason is required to {{ verb }}.</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-if value="{{ hasReason }}"><button type="button" onClick="{{ onConfirm }}" style="min-height:44px;padding:0 20px;font-family:inherit;font-size:16px;font-weight:600;color:#ffffff;background:#2f6f73;border:1px solid #2f6f73;border-radius:2px;cursor:pointer" style-hover="background:#1f2a44;border-color:#1f2a44">{{ confirmLabel }}</button></sc-if>
<sc-if value="{{ noReason }}"><button type="button" disabled="{{ true }}" style="min-height:44px;padding:0 20px;font-family:inherit;font-size:16px;font-weight:600;color:#566074;background:#d6dce2;border:1px solid #d6dce2;border-radius:2px;cursor:not-allowed">{{ confirmLabel }}</button></sc-if>
<button type="button" onClick="{{ onCancel }}" style="min-height:44px;padding:0 20px;font-family:inherit;font-size:16px;font-weight:600;color:#1f2a44;background:#ffffff;border:1px solid #1f2a44;border-radius:2px;cursor:pointer" style-hover="background:#e2eeee">Cancel</button>
</div>
</div>
</sc-if>
<sc-if value="{{ isClosed }}"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:15px"><span>{{ closedText }}</span><button type="button" onClick="{{ onCancel }}" style="min-height:44px;padding:0;font-family:inherit;font-size:15px;font-weight:500;color:#2f6f73;background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer" style-hover="color:#1f2a44">Undo</button></div></sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:420},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;adjust&quot;,&quot;reject&quot;,&quot;approved&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reason&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mode: null, reason: null };
  renderVals() {
    const it = this.props.item || { engine: 'Regulation Register', id: 'TL-FTA-12', kind: 'Change proposal', waiting: '9 days', ask: 'Move TL-FTA-12, rules of origin, from Negotiation to Text published', evidence: [{ fact: 'Consolidated rules-of-origin text published', source: 'EU trade portal', date: '27 Oct 2026', status: 'Reported', tone: 'neutral' }], actBy: 'Fri 7 Nov', link: 'Open TL-FTA-12 in the Regulation Register' };
    const mode = this.state.mode ?? this.props.mode ?? it.mode ?? 'default';
    const reason = this.state.reason ?? this.props.reason ?? it.reason ?? '';
    const set = (m) => () => this.setState({ mode: m });
    const closed = { approved: 'Approved. Logged in the audit trail with the evidence it rested on.', adjusted: 'Adjusted. Your reason is logged with the item.', rejected: 'Rejected. Your reason is logged with the item.' }[mode] || '';
    const rej = mode === 'reject';
    return {
      it, hasActBy: !!it.actBy, hasRouting: !!it.routing, hasGates: !!it.gates, g: it.gates || {}, hasLink: !!it.link,
      isDefault: mode === 'default', isReasoning: mode === 'adjust' || rej, isClosed: !!closed, closedText: closed,
      reasonLabel: rej ? 'Why reject it?' : 'What should change, and why?', confirmLabel: rej ? 'Reject' : 'Adjust', verb: rej ? 'reject' : 'adjust',
      reason, hasReason: !!reason.trim(), noReason: !reason.trim(),
      onApprove: set('approved'), onAdjust: set('adjust'), onReject: set('reject'),
      onCancel: () => this.setState({ mode: 'default', reason: '' }),
      onReason: (e) => this.setState({ reason: e.target.value }),
      onConfirm: () => this.setState({ mode: rej ? 'rejected' : 'adjusted' })
    };
  }
}
</script>
</body>
</html>
